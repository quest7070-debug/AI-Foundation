[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-foundation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "hatchet-sdk>=1.40,<2", "pydantic-ai-slim==2.47.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "libcst==1.9.0"]
remote = ["pywebpush==2.5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_foundation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
