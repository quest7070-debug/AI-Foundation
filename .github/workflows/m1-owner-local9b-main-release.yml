name: Foundation M1 owner main local9B release
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: read
concurrency:
  group: foundation-m1-local9b-main-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'quest7070-dev/AI-Foundation' &&
      github.actor == 'quest7070-debug' &&
      github.event.issue.user.login == 'quest7070-debug' &&
      startsWith(github.event.issue.title, 'Foundation M1 9B Release: ')
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 12
    steps:
      - name: Checkout exact issue-time reviewed main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact owner Guard admission and queue-preserving worker cutover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: "1"
        run: /opt/homebrew/bin/python3.12 -B scripts/m1_github_owner_local9b_release.py
