                       'gui/501/dev.quest7070.ai-foundation.operator'],
                      capture_output=True,text=True,timeout=5,check=False)
                  result['operator_launchd_registered']=launch.returncode==0
                  pids=([line.strip()[6:] for line in launch.stdout.splitlines()
                         if line.strip().startswith('pid = ')]
                        if launch.returncode==0
                        and len(launch.stdout)<=131072 else [])
                  pids=[p for p in pids if p.isdigit()]
                  result['operator_launchd_pid_present']=len(pids)==1
                  if len(pids)==1:
                      listener=subprocess.run(
                          ['/usr/sbin/lsof','-nP','-t','-iTCP:8766',
                           '-sTCP:LISTEN'],
                          capture_output=True,text=True,timeout=5,
                          check=False)
                      result['operator_pid_listening_8766']=(
                          listener.returncode==0
                          and listener.stdout.strip()==pids[0])
                  else:
                      result['operator_pid_listening_8766']=False
              except (OSError,ValueError,subprocess.SubprocessError):
                  result['operator_launchd_probe']='UNVERIFIED'
              matches=[Path(arg) for arg in argv if arg.startswith('/')
                       and arg.endswith('run_remote_gateway.py')]
              result['installed_runner_pinned']=len(matches)==1
              # Report only the exact approved-source lineage declared by the
              # existing owner LaunchAgent. No private path, environment
              # secret, file contents or claim about loaded module cache.
              import re
              declared=doc.get('WorkingDirectory')
              parent=Path.home()/'.ai-foundation-tunnel-sources'
              if (type(declared) is str and
                  re.fullmatch(r'[0-9a-f]{40}',Path(declared).name) and
                  Path(declared).parent==parent and
                  not Path(declared).is_symlink()):
                  result['gateway_declared_source_sha']=Path(declared).name
                  source=Path(declared)/'scripts'/'remote_gateway.py'
                  if (not source.is_symlink() and source.is_file()
                      and 0<source.stat().st_size<=30000):
                      result['gateway_declared_source_digest']=hashlib.sha256(
                          source.read_bytes()).hexdigest()
              # The preceding inert M1 stage produced an exact SHA-owned
              # candidate. Compare on-disk source bytes, not process modules
              # or untrusted network responses. Never infer approval or apply.
              candidate_sha=os.environ.get('CANDIDATE_SHA','')
              if re.fullmatch(r'[0-9a-f]{40}',candidate_sha):
                  stage=parent/candidate_sha
                  candidate=stage/'scripts'/'remote_gateway.py'
                  if (stage.is_dir() and not stage.is_symlink()
                      and not candidate.is_symlink() and candidate.is_file()
                      and 0<candidate.stat().st_size<=30000):
                      result['gateway_candidate_source_sha']=candidate_sha
                      result['gateway_candidate_source_digest']=hashlib.sha256(
                          candidate.read_bytes()).hexdigest()
                      if 'gateway_declared_source_digest' in result:
                          changed=(result['gateway_candidate_source_digest']
                                   != result['gateway_declared_source_digest'])
                          result['gateway_source_update_required']=changed
                          result['gateway_source_provenance']='DECLARED_DISK_ONLY'
                          # Disk parity alone never proves loaded module/PID
                          # identity or authenticated browser POST acceptance.
                          # A stale source is a known blocker; equal source
                          # remains unverified until the independent live gate.
                          result['mobile_owner_post_gate']=(
                              'SOURCE_UPDATE_REQUIRED' if changed
                              else 'LIVE_OWNER_POST_UNVERIFIED')
                  # The independent source-stage job already byte-attests
                  # and AST-checks this exact candidate. Do NOT import or
                  # execute Draft source inside the privileged M1 readback.
                  # Existing Gateway journal was separately observed on M1;
                  # that historical receipt is not fresh owner authorization.
                  result['gateway_guard_journal']='NOT_READ_IN_THIS_JOB'
              # No private paths or secret environment values are exported.
              result['status']='GATEWAY_INSTALLED_READONLY_OBSERVED'
          except (OSError,ValueError,TypeError,IndexError,
                  plistlib.InvalidFileException,subprocess.SubprocessError) as e:
              # Export only small fixed classification codes, never paths,
              # subprocess output, environment values or owner identities.
              reason=str(e)
              result['reason']=(reason if reason in (
                  'OWNER_M1_REQUIRED','OWNER_PLIST_SET_UNBOUNDED',
                  'GATEWAY_PLIST_NOT_IDENTIFIED','OWNER_LAUNCHD_UNVERIFIED',
                  'GATEWAY_PORT_IDENTITY_CHANGED')
                  else 'RUNTIME_OR_PLIST_READBACK_UNVERIFIED')
              result['status']='GATEWAY_INSTALLED_READBACK_UNVERIFIED'
          print(json.dumps(result,sort_keys=True))
          PY

  owner-origin-probe-noeffect:
    # One deliberately invalid HMAC token against the already installed
    # /release/probe-post. No valid release token, no Guard/Work effect, and
    # never represents an Android owner POST acceptance.
    needs: [owner-source-stage]
    if: >-
      github.repository == 'quest7070-dev/AI-Foundation' &&
      github.event.pull_request.number == 1506 &&
      github.event.pull_request.user.login == 'quest7070-debug' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/postcutover-gateway-upstream-readback-20261120' &&
      github.event.pull_request.base.ref == 'fix/owner-code-manifest-capacity-20261120' &&
      github.event.pull_request.base.sha == '358885c1793911f467d1adbb963922d9622bfd45'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Classify existing Serve no-effect owner POST gate with invalid token
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          /opt/homebrew/bin/python3.12 -B - <<'PY'
          import http.client, json, os, platform, ssl
          host = 'owner-m1.example.ts.net'
          result = {
              'status': 'OWNER_ORIGIN_PROBE_UNVERIFIED',
              'transport': 'UNVERIFIED',
              'gateway_gate': 'UNVERIFIED',
              'physical_android': 'NOT_VERIFIED',
              'token': 'DELIBERATELY_INVALID',
              'guard_writes': 0,
              'service_mutations': 0,
              'model_calls': 0,
          }
          if (platform.system() != 'Darwin' or platform.machine() not in
                  ('arm64', 'aarch64') or os.getuid() != 501
                  or os.geteuid() != 501):
              print(json.dumps(result, sort_keys=True))
              raise SystemExit(1)
          conn = None
          try:
              conn = http.client.HTTPSConnection(
                  host, 8454, timeout=6, context=ssl.create_default_context())
              payload = 'token=invalid&confirmed=yes'
              conn.request('POST', '/release/probe-post', body=payload,
                           headers={
                               'Origin': 'https://' + host + ':8454',
                               'Content-Type': 'application/x-www-form-urlencoded',
                               'Sec-Fetch-Site': 'same-origin',
                               'Content-Length': str(len(payload)),
                           })
              reply = conn.getresponse()
              body = reply.read(16385)
              result['transport'] = 'HTTPS_RESPONSE_RECEIVED'
              if len(body) <= 16384:
                  if body.find(b'owner origin rejected') >= 0:
                      result['gateway_gate'] = 'ORIGIN_REJECTED'
                  elif body.find(b'owner verification unavailable') >= 0:
                      result['gateway_gate'] = 'OWNER_UNAVAILABLE'
                  elif body.find(b'host rejected') >= 0:
                      result['gateway_gate'] = 'HOST_REJECTED'
                  elif (reply.status == 403
                        and body.find('POST通信の本人確認に失敗'.encode()) >= 0):
                      result['gateway_gate'] = 'OWNER_AND_ORIGIN_PASSED_BAD_TOKEN'
                  else:
                      result['gateway_gate'] = 'OTHER_BOUNDED_RESPONSE'
              result['http_status'] = reply.status
              result['status'] = 'OWNER_ORIGIN_PROBE_OBSERVED_NO_EFFECT'
          except (OSError, ValueError, TypeError, TimeoutError,
                  http.client.HTTPException, ssl.SSLError):
              result['transport'] = 'UNREACHABLE_OR_TLS_UNVERIFIED'
          finally:
              if conn is not None:
                  conn.close()
          print(json.dumps(result, sort_keys=True))
          PY

  owner-p0-operator-observation-noeffect:
