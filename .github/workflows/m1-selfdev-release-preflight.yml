              "guard_writes": 0,
              "service_mutations": 0,
              "model_calls": 0,
              "physical_android": "NOT_CHECKED",
          }
          if (platform.system() != "Darwin" or platform.machine() != "arm64"
                  or os.getuid() != 501 or os.geteuid() != 501):
              result["status"] = "NOT_OWNER_M1"
              print(json.dumps(result, sort_keys=True))
              raise SystemExit(2)
          conn = http.client.HTTPConnection("127.0.0.1", 8766, timeout=3)
          try:
              conn.request("GET", "/api/human",
                           headers={"Host": "127.0.0.1:8766"})
              response = conn.getresponse()
              data = response.read(524289)
              if response.status == 200 and len(data) <= 524288:
                  try:
                      payload = json.loads(data)
                      result["operator_api"] = (
                          "HTTP_200_VALID_JSON" if type(payload) is dict
