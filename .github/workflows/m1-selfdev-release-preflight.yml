          finally:
              conn.close()
          conn = http.client.HTTPSConnection(
              "127.0.0.1", 8793, timeout=3,
              context=ssl._create_unverified_context())
          try:
              conn.request("GET", "/health",
                           headers={"Host": "127.0.0.1"})
              response = conn.getresponse()
              body = response.read(130)
              if (response.status == 200
                      and body in (b'{"ok":true,"upstream":true}\\n',
                                   b'{"ok":true,"upstream":true}\n')):
                  result["gateway_upstream"] = "OPERATOR_READY"
              elif response.status == 503:
                  result["gateway_upstream"] = "OPERATOR_UNAVAILABLE"
              else:
                  result["gateway_upstream"] = "HTTP_UNVERIFIED"
          except (OSError, ValueError, http.client.HTTPException):
              result["gateway_upstream"] = "HTTP_UNAVAILABLE"
          finally:
              conn.close()
          print(json.dumps(result, sort_keys=True))
          PY
  owner-review-live-source-discriminator:
    # Exact-owner no-effect observation; no source bytes, request text,
    # Guard identifiers, private paths, model calls or service changes.
    if: >-
      github.repository == 'quest7070-dev/AI-Foundation' &&
      github.event.pull_request.number == 1509 &&
      github.event.pull_request.user.login == 'quest7070-debug' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-review-source-unification-20261121' &&
      github.event.pull_request.base.ref == 'fix/p0-mcp-operator-status-failclosed-20261121' &&
      github.event.pull_request.base.sha == '92e9a7e643cfd028047cccb70d3f3b338b8cd79d'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout exact reviewed successor without stored credentials
        uses: actions/checkout@v5
        with:
          path: .foundation-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Diagnose installed Operator source and real CODE review contract without effect
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src:scripts:.
        working-directory: ${{ github.workspace }}/.foundation-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          /opt/homebrew/bin/python3.12 -B - <<'PY'
          import http.client, json, os, platform, re, sys
          from pathlib import Path
          r={
              "status":"OWNER_REVIEW_SOURCE_UNVERIFIED",
              "read_only":True,
              "guard_writes":0,"work_writes":0,
              "model_calls":0,"service_mutations":0,
              "owner_local_repo":"UNVERIFIED",
              "guard_registry":"UNVERIFIED",
              "original_guard_release":"UNVERIFIED",
              "installed_source":"UNVERIFIED",
              "same_git_history":"UNVERIFIED",
              "pending_states":"UNVERIFIED",
              "actual_live_review":"UNVERIFIED",
          }
          allowed=frozenset({
              "VERIFIED","PREDECESSOR_IDENTITY_INVALID",
              "PREDECESSOR_STAGE_NOT_FOUND","PREDECESSOR_STAGE_UNTRUSTED",
              "PREDECESSOR_STAGE_UNVERIFIED","PREDECESSOR_MANIFEST_MISMATCH",
              "PREDECESSOR_SCRIPT_HASH_CHANGED","RUNNING_PLIST_NOT_PREDECESSOR",
              "INSTALLED_PREVIOUS_OPERATOR_RESTORED",
              "LAUNCHD_RUNNING_COMMAND_UNVERIFIED","RUNNING_PID_NOT_BOUND",
              "RUNNING_OPERATOR_API_UNAVAILABLE","PREDECESSOR_READBACK_UNVERIFIED",
          })
          try:
              if (sys.platform!="darwin" or platform.machine() not in ("arm64","aarch64")
                      or os.getuid()!=501 or os.geteuid()!=501):
                  raise ValueError("NOT_OWNER_M1")
              from scripts import m1_operator_release_cli as cli
              from scripts import m1_development_review_candidate as candidate
              from scripts.m1_development_owner_review import OwnerDevelopmentReview
              from scripts.m1_development_ticket_factory import _owner_local_repo, _git
              from scripts.m1_direct_development import installed_config
              _, cfg, root = installed_config()
              repo=_owner_local_repo()
              r["owner_local_repo"]="OWNER_VERIFIED"
              pending=OwnerDevelopmentReview(
                  root,repo_factory=lambda:repo,work_db=cfg.work_db).pending_review_statuses()
              by={}
              for item in pending:
                  state=item["state"]
                  by[state]=by.get(state,0)+1
              r["pending_states"]=dict(sorted(by.items()))
              r["pending_count"]=len(pending)
              try:
                  gate=cli._guard_gate(Path.home(),readonly=True)
                  record=gate.registry.get("m1-operator")
                  if record is not None and getattr(record,"status",None)=="VERIFIED":
                      r["guard_registry"]="CURRENT_VERIFIED_RECORD"
                      authority=getattr(record,"candidate_authority",None)
                      if isinstance(authority,str) and re.fullmatch(
                          "github-commit:[0-9a-f]{40}",authority):
                          sha=authority.removeprefix("github-commit:")
                          stage=Path.home()/".ai-foundation-tunnel-sources"/sha
                          try:
                              cli._owner_staged_source(sha,Path.home(),stage)
                              r["installed_source"]="STAGE_CLEAN"
                              host=cli.FixedOperatorHost(stage,home=Path.home())
                              observed=host.diagnose_current_release(record)
                              r["original_guard_release"]=(
                                  observed if observed in allowed else "UNVERIFIED")
                              common=lambda path: Path(_git(path,"rev-parse","--git-common-dir"))
                              def canonical(path):
                                  val=common(path)
                                  return (val if val.is_absolute() else path/val).resolve(strict=True)
                              r["same_git_history"]=(
                                  "YES" if canonical(repo)==canonical(stage) else "NO")
                          except (OSError,ValueError,PermissionError,RuntimeError):
                              r["installed_source"]="STAGE_UNVERIFIED"
                  else:
                      r["guard_registry"]="CURRENT_VERIFIED_RECORD_UNAVAILABLE"
              except (OSError,ValueError,PermissionError,RuntimeError):
                  r["guard_registry"]="REGISTRY_SELECTION_UNVERIFIED"
              conn=http.client.HTTPConnection("127.0.0.1",8766,timeout=4)
              try:
                  conn.request("GET","/development/review",headers={
                      "Host":"127.0.0.1:8766"})
                  response=conn.getresponse()
                  body=response.read(98305)
                  if response.status==200 and len(body)<=98304:
                      html=body.decode("utf-8")
                      r["actual_live_review"]="HTTP_200"
                      r["actual_live_preview_button_count"]=len(re.findall(
                          r'の内容を確認</button>',html))
                  else:
                      r["actual_live_review"]="NOT_200_OR_UNBOUNDED"
              except (OSError,ValueError,UnicodeDecodeError,http.client.HTTPException):
                  r["actual_live_review"]="HTTP_UNAVAILABLE"
              finally:conn.close()
              r["status"]="OWNER_REVIEW_SOURCE_OBSERVED_NO_EFFECT"
          except (OSError,ValueError,PermissionError,RuntimeError,ImportError):
              pass
          print(json.dumps(r,sort_keys=True))
          PY
