name: Foundation M1 self-development preflight and inert source stage

# Read-only observation followed by an immutable source-only worktree.\n# Never switches a running service or grants execution authority.
on:
  pull_request:
    types: [synchronize]
    paths:
      - "src/ai_foundation/operator.py"
      - "src/ai_foundation/operator_server.py"
      - "src/ai_foundation/operator_mcp_tools.py"
      - "tests/test_operator_server.py"
      - "tests/test_operator_development_state.py"
      - "tests/test_operator_mcp_tools.py"
      - "scripts/m1_selfdev_release_preflight.py"
      - "tests/test_m1_selfdev_release_preflight.py"
      - ".github/workflows/m1-selfdev-release-preflight.yml"
      - "src/ai_foundation/migration.py"
      - "docs/END_GOAL.md"
      - "src/ai_foundation/release_gate.py"
      - "scripts/m1_operator_release_host.py"
      - "scripts/m1_operator_release_cli.py"
      - "scripts/m1_mobile_owner_release.py"
      - "scripts/m1_mobile_gateway_bootstrap.py"
      - "scripts/m1_mobile_gateway_successor.py"
      - "tests/test_m1_mobile_gateway_bootstrap.py"
      - "tests/test_m1_mobile_gateway_successor.py"
      - "scripts/m1_owner_production_recovery.py"
      - "tests/test_m1_owner_production_recovery.py"
      - "scripts/remote_gateway.py"
      - "scripts/run_remote_gateway.py"
      - "scripts/operator_server.py"
      - "src/ai_foundation/gateway_csrf.py"
      - "tests/test_remote_gateway.py"
      - "tests/test_gateway_csrf.py"
      - "tests/test_m1_mobile_owner_release.py"
      - "tests/test_m1_mobile_owner_release.py"
      - "tests/test_release_gate.py"
      - "tests/test_m1_operator_release_host.py"
      - "tests/test_m1_operator_release_cli.py"
      - "src/ai_foundation/development_requests.py"
      - "src/ai_foundation/mcp_host.py"
      - "src/ai_foundation/human_renderer.py"
      - "tests/test_human_renderer.py"
      - "scripts/m1_strata_runtime_probe.py"
      - ".github/workflows/m1-strata-code-discovery.yml"
      - "scripts/foundation_mcp_stdio.py"
      - "scripts/m1_owner_delegated_mcp_stdio.py"
      - "scripts/m1_development_ticket_factory.py"
      - "scripts/m1_direct_development.py"
      - "scripts/m1_strata_owner_ticket_admission.py"
      - "scripts/m1_reviewed_strata_ticket.py"
      - "scripts/m1_strata_ticket_overview.py"
      - "scripts/m1_selfdev_release_preflight.py"
      - "tests/test_m1_selfdev_release_preflight.py"
      - "tests/test_m1_strata_ticket_overview.py"
permissions:
  contents: read
concurrency:
  group: foundation-m1-selfdev-readonly-probe
  cancel-in-progress: false
jobs:
  owner-source-readonly:
    if: >-
      github.repository == 'quest7070-dev/AI-Foundation' &&
      github.event.pull_request.user.login == 'quest7070-debug' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.number == 1419 &&
         github.event.pull_request.head.ref == 'feat/owner-klm-review-code-withdrawal-20261117')
        ||
        (github.event.pull_request.number == 1502 &&
         github.event.pull_request.head.ref == 'fix/owner-mobile-gateway-actions-20261119' &&
         github.event.pull_request.base.ref == 'feat/owner-klm-review-code-withdrawal-20261117' &&
         github.event.pull_request.base.sha == '685e6880e02f906792a28c492041f2d15b84f8d7')
        ||
        (github.event.pull_request.number == 1503 &&
         github.event.pull_request.head.ref == 'feat/mobile-owner-release-no-terminal-20261119' &&
         github.event.pull_request.base.ref == 'fix/owner-mobile-gateway-actions-20261119' &&
         github.event.pull_request.base.sha == '425e6d4a0dfe80eb50b9d18554286682fba57c3f')
        ||
        (github.event.pull_request.number == 1505 &&
         github.event.pull_request.head.ref == 'fix/owner-code-manifest-capacity-20261120' &&
         github.event.pull_request.base.ref == 'feat/mobile-owner-release-no-terminal-20261119' &&
         github.event.pull_request.base.sha == '739a823c57ed6dbc1ca48e30c01ab7fbe2918d9d')
        ||
        (github.event.pull_request.number == 1506 &&
         github.event.pull_request.head.ref == 'fix/postcutover-gateway-upstream-readback-20261120' &&
         github.event.pull_request.base.ref == 'fix/owner-code-manifest-capacity-20261120' &&
         github.event.pull_request.base.sha == '358885c1793911f467d1adbb963922d9622bfd45')
        ||
        (github.event.pull_request.number == 1507 &&
         github.event.pull_request.head.ref == 'fix/p0-mcp-operator-status-failclosed-20261121' &&
         github.event.pull_request.base.ref == 'fix/postcutover-gateway-upstream-readback-20261120' &&
         github.event.pull_request.base.sha == '15815926d09ef15d9b804603bfb99ae7c3f24c6e')
        ||
        (github.event.pull_request.number == 1509 &&
         github.event.pull_request.head.ref == 'fix/p0-review-source-unification-20261121' &&
         github.event.pull_request.base.ref == 'fix/p0-mcp-operator-status-failclosed-20261121' &&
         github.event.pull_request.base.sha == '92e9a7e643cfd028047cccb70d3f3b338b8cd79d')
        ||
        (github.event.pull_request.number == 1510 &&
         github.event.pull_request.head.ref == 'fix/p0-operator-review-runtime-import-root-20261121' &&
         github.event.pull_request.base.ref == 'fix/p0-review-source-unification-20261121' &&
         github.event.pull_request.base.sha == '1b231058ee6d15c97419ed63140ef8a125c9d536')
        ||
        (github.event.pull_request.number == 1514 &&
         github.event.pull_request.head.ref == 'fix/p0-selfdev-fastlane-single-acceptance-20261121' &&
         github.event.pull_request.base.ref == 'fix/p0-operator-review-runtime-import-root-20261121' &&
         github.event.pull_request.base.sha == 'd4ef51c2dbbe957eb5ed55b6897bd4a43d29110f')
      )
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 4
    steps:
      - name: Checkout exact owner Draft SHA without persistent credentials
        uses: actions/checkout@v5
        with:
          path: .foundation-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read-only source and existing tunnel readiness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src:scripts:.
        working-directory: ${{ github.workspace }}/.foundation-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          /opt/homebrew/bin/python3.12 -B scripts/m1_selfdev_release_preflight.py

  owner-source-stage:
    # Source-only staging is a private, inert worktree; a separate current
    # Guard owner release remains mandatory before any running-code switch.
    needs: [owner-source-readonly]
    if: >-
      github.repository == 'quest7070-dev/AI-Foundation' &&
      github.event.pull_request.user.login == 'quest7070-debug' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.pull_request.number == 1419 &&
         github.event.pull_request.head.ref == 'feat/owner-klm-review-code-withdrawal-20261117')
        ||
        (github.event.pull_request.number == 1502 &&
         github.event.pull_request.head.ref == 'fix/owner-mobile-gateway-actions-20261119' &&
         github.event.pull_request.base.ref == 'feat/owner-klm-review-code-withdrawal-20261117' &&
         github.event.pull_request.base.sha == '685e6880e02f906792a28c492041f2d15b84f8d7')
        ||
        (github.event.pull_request.number == 1503 &&
         github.event.pull_request.head.ref == 'feat/mobile-owner-release-no-terminal-20261119' &&
         github.event.pull_request.base.ref == 'fix/owner-mobile-gateway-actions-20261119' &&
         github.event.pull_request.base.sha == '425e6d4a0dfe80eb50b9d18554286682fba57c3f')
        ||
        (github.event.pull_request.number == 1505 &&
         github.event.pull_request.head.ref == 'fix/owner-code-manifest-capacity-20261120' &&
         github.event.pull_request.base.ref == 'feat/mobile-owner-release-no-terminal-20261119' &&
         github.event.pull_request.base.sha == '739a823c57ed6dbc1ca48e30c01ab7fbe2918d9d')
        ||
        (github.event.pull_request.number == 1506 &&
         github.event.pull_request.head.ref == 'fix/postcutover-gateway-upstream-readback-20261120' &&
         github.event.pull_request.base.ref == 'fix/owner-code-manifest-capacity-20261120' &&
         github.event.pull_request.base.sha == '358885c1793911f467d1adbb963922d9622bfd45')
        ||
        (github.event.pull_request.number == 1507 &&
         github.event.pull_request.head.ref == 'fix/p0-mcp-operator-status-failclosed-20261121' &&
         github.event.pull_request.base.ref == 'fix/postcutover-gateway-upstream-readback-20261120' &&
         github.event.pull_request.base.sha == '15815926d09ef15d9b804603bfb99ae7c3f24c6e')
        ||
        (github.event.pull_request.number == 1509 &&
         github.event.pull_request.head.ref == 'fix/p0-review-source-unification-20261121' &&
         github.event.pull_request.base.ref == 'fix/p0-mcp-operator-status-failclosed-20261121' &&
         github.event.pull_request.base.sha == '92e9a7e643cfd028047cccb70d3f3b338b8cd79d')
        ||
        (github.event.pull_request.number == 1510 &&
         github.event.pull_request.head.ref == 'fix/p0-operator-review-runtime-import-root-20261121' &&
         github.event.pull_request.base.ref == 'fix/p0-review-source-unification-20261121' &&
         github.event.pull_request.base.sha == '1b231058ee6d15c97419ed63140ef8a125c9d536')
        ||
        (github.event.pull_request.number == 1514 &&
         github.event.pull_request.head.ref == 'fix/p0-selfdev-fastlane-single-acceptance-20261121' &&
         github.event.pull_request.base.ref == 'fix/p0-operator-review-runtime-import-root-20261121' &&
         github.event.pull_request.base.sha == 'd4ef51c2dbbe957eb5ed55b6897bd4a43d29110f')
      )
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 4
    steps:
      - name: Checkout exact owner Draft SHA without token persistence
        uses: actions/checkout@v5
        with:
          path: .foundation-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # Imported commits must include the actual main ancestry. A shallow
          # source-stage worktree otherwise fails the real owner Canon gate.
          fetch-depth: 0
      - name: Stage immutable source worktree and independently compare exact bytes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src:scripts:.
        working-directory: ${{ github.workspace }}/.foundation-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          set -euo pipefail
          /opt/homebrew/bin/python3.12 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          from m1_selfdev_release_preflight import ROOT, scoped_event, source_probe
          from m1_foundation_tunnel_stage import stage_source, StageDenied
          from m1_foundation_tunnel import _trusted_bytes
          from m1_operator_release_canon import observe_release_canon
          try:
              event=json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              head=subprocess.run(
                  ["/usr/bin/git","-C",str(ROOT),"rev-parse","HEAD"],
                  capture_output=True,text=True,check=True,timeout=5).stdout.strip()
              if (not scoped_event(event,env=os.environ,current_sha=head)
                      or platform.system()!="Darwin"
                      or platform.machine() not in ("arm64","aarch64")
                      or os.getuid()!=501 or os.geteuid()!=501):
                  raise ValueError("OWNER_EXACT_DRAFT_REQUIRED")
              result=stage_source()
              if result["status"]!="SOURCE_STAGED_VERIFIED" or result["revision"]!=head:
                  raise ValueError("STAGED_REVISION_UNVERIFIED")
              stage=Path.home()/".ai-foundation-tunnel-sources"/head
              evidence=source_probe(ROOT,stage,_trusted_bytes)
              if evidence["owner_checkout_source_match"] is not True:
                  raise ValueError("STAGED_SOURCE_HASH_MISMATCH")
              # Verify *this actual private owner worktree*, not the separate
              # CI checkout. Canon still reads fresh GitHub main and validates
              # policy files. Never create a Guard approval or a service effect.
              canon=observe_release_canon(stage)
              if (canon.get("status")!="CANON_SOURCE_VERIFIED"
                      or canon.get("source_count")!=6):
                  raise ValueError("STAGED_CANON_SOURCE_UNVERIFIED")
              # For the one-time smartphone bootstrap inspect the *actual*
              # installed gateway plist and prove it accepts the candidate
              # constrained loopback definition, without any service effect.
              gateway_shape="NOT_REQUIRED"
              if event["pull_request"]["number"]==1503:
                  from scripts.m1_mobile_gateway_bootstrap import (
                      _owned_plist, _candidate_plist)
                  import plistlib
                  _, _, prior_doc, _ = _owned_plist()
                  candidate_plist=plistlib.loads(_candidate_plist(prior_doc,stage))
                  if (candidate_plist.get("Label")!=
                          "dev.quest7070.ai-foundation.remote-gateway"):
                      raise ValueError("STAGED_GATEWAY_HOST_IDENTITY_UNVERIFIED")
                  gateway_shape="OWNER_INSTALLED_PLIST_CANDIDATE_VERIFIED"
              print(json.dumps({
                  "status":"IMMUTABLE_SOURCE_STAGED_VERIFIED",
                  "revision":head,
                  "verified_source_files":evidence["candidate_python_files_checked"],
                  "source_bytes_equal":True,
                  "canon_source_ancestry_verified":True,
                  "canon_source_main":canon["source_main"],
                  "gateway_plist_shape":gateway_shape,
                  "owner_checkout_unchanged":result["owner_branch_changed"] is False,
                  "production_installed":False,
                  "tunnel_switched":False,"model_calls":0,"service_mutations":0
              },sort_keys=True))
          except (OSError,ValueError,TypeError,StageDenied,
                  subprocess.SubprocessError,RuntimeError) as e:
              # Only source-defined, fixed gateway preflight reason codes
              # may leave the owner M1. Never return args, env, paths, stderr.
              allowed={
                  "EXACT_GATEWAY_LAUNCHAGENT_UNAVAILABLE",
                  "GATEWAY_LAUNCH_SHAPE_UNVERIFIED",
                  "GATEWAY_PORT_OR_TLS_CHANGED",
                  "GATEWAY_PYTHON_LAUNCHER_MISMATCH",
                  "GATEWAY_PYTHON_ENV_UNTRUSTED",
                  "GATEWAY_PORT_CHANGED",
                  "GATEWAY_TLS_ARGS_UNVERIFIED",
                  "GATEWAY_RUNNER_IDENTITY_UNVERIFIED",
                  "GATEWAY_LISTEN_OPTION_INVALID",
                  "GATEWAY_LOOPBACK_NOT_PINNED",
              }
              reason=(str(e) if type(e).__name__=="BootstrapDenied"
                      and str(e) in allowed
                      else "OWNER_SOURCE_STAGING_UNVERIFIED")
              observation={"status":"BLOCKED","reason":reason,
                           "model_calls":0,"service_mutations":0}
              if reason=="GATEWAY_PYTHON_LAUNCHER_MISMATCH":
                  # A finite diagnostic only. Do not export argv, paths,
                  # home directory, environment or other owner data.
                  try:
                      from scripts.m1_mobile_gateway_bootstrap import (
                          _owned_plist, _launcher_kind)
                      observation["gateway_launcher_kind"]=_launcher_kind(
                          _owned_plist()[2].get("ProgramArguments"))
                  except (OSError,ValueError,TypeError,RuntimeError):
                      observation["gateway_launcher_kind"]="UNVERIFIED"
              print(json.dumps(observation))
              raise SystemExit(1)
          PY

  owner-pending-code-triage-readonly:
    # Classify existing pending CODE reviews using the real owner M1 Work DB,
    # tracked source + fixed tests. Never output private instructions/source,
    # create approvals, admit a task or write to the owner checkout.
    needs: [owner-source-stage]
    if: >-
      github.repository == 'quest7070-dev/AI-Foundation' &&
      github.event.pull_request.number == 1503 &&
      github.event.pull_request.user.login == 'quest7070-debug' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/mobile-owner-release-no-terminal-20261119' &&
      github.event.pull_request.base.ref == 'fix/owner-mobile-gateway-actions-20261119' &&
      github.event.pull_request.base.sha == '425e6d4a0dfe80eb50b9d18554286682fba57c3f'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout exact immutable owner Draft without persisted credentials
        uses: actions/checkout@v5
        with:
          path: .foundation-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Classify current pending review readiness without Work or Guard effects
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src:scripts:.
        working-directory: ${{ github.workspace }}/.foundation-ci/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
        run: |
          /opt/homebrew/bin/python3.12 -B - <<'PY'
          import json, os, platform, sqlite3
          from pathlib import Path
          from scripts.m1_development_review_candidate import _saved_request, _TARGET, _TEST
          from scripts.m1_development_owner_review import OwnerDevelopmentReview
          from scripts.m1_development_ticket_factory import _owner_local_repo
          from scripts.m1_direct_development import installed_config
          from scripts.m1_development_bridge import require_m1

          # Emit only fixed reason codes and aggregate counts. Never print
          # ticket names, owner paths, prompts, source bytes or exception text.
          allowed=frozenset({
              'REQUEST_NOT_WAITING_FOR_REVIEW',
              'REQUEST_CONTENT_INVALID',
              'REVIEW_SCOPE_SELECTION_REQUIRED',
              'OWNER_CHECKOUT_NOT_CLEAN',
              'OWNER_CHECKOUT_CHANGED_DURING_REVIEW',
              'CANDIDATE_SOURCE_OR_TEST_UNVERIFIED',
              'OWNER_BASE_UNVERIFIED',
              'REQUEST_CHANGED_DURING_REVIEW',
              'OWNER_WORK_DATABASE_UNVERIFIED',
              'OWNER_LOCAL_REPOSITORY_UNVERIFIED',
          })
          result={
              'status':'OWNER_PENDING_CODE_TRIAGE_UNVERIFIED',
              'read_only':True, 'work_writes':0, 'guard_writes':0,
              'model_calls':0, 'service_mutations':0, 'production_installed':False,
          }
          try:
              require_m1()
              if (platform.system()!='Darwin'
                      or platform.machine() not in ('arm64','aarch64')
                      or os.getuid()!=501 or os.geteuid()!=501):
                  raise ValueError('OWNER_M1_REQUIRED')
              _, config, root = installed_config()
              repo = _owner_local_repo()
              service = OwnerDevelopmentReview(
                  root,repo_factory=lambda:repo,work_db=config.work_db)
              pending=service.pending_review_statuses()
              counts={}
              for row in pending:
                  code=row['state']
                  counts[code]=counts.get(code,0)+1
              # Output only source code basenames (not arbitrary owner paths),
              # safe enum codes and existence booleans. No private instructions
              # or source/test contents ever leave the M1 owner host.
              summarized=[]
              for row in pending:
                  item=dict(ticket_id=row['ticket_id'],state=row['state'])
                  try:
                      instruction=_saved_request(
                          root,row['ticket_id'],work_db=config.work_db)
                      targets=sorted(set(_TARGET.findall(instruction)))
                      tests=sorted(set(_TEST.findall(instruction)))
                      item['target_mentions']=len(targets)
                      item['test_mentions']=len(tests)
                      if len(targets)==1:
                          path=Path(targets[0])
                          item['target_file']=path.name
                          item['owner_source_present']=(repo / path).is_file()
                          item['candidate_source_present']=(Path.cwd()/path).is_file()
                  except (OSError,ValueError,PermissionError,RuntimeError,
                          sqlite3.Error):
                      item['source_hint']='UNVERIFIED'
                  summarized.append(item)
              result.update(
                  status='OWNER_PENDING_CODE_TRIAGE_OBSERVED',
                  pending_count=len(pending),
                  preview_ready_count=counts.get('PREVIEW_READY',0),
                  categories={key:counts[key] for key in sorted(counts)},
                  per_ticket=summarized,
              )
          except (OSError,ValueError,PermissionError,RuntimeError,
                  sqlite3.Error):
              # Do not expose the owner machine's private failure details.
              pass
          print(json.dumps(result,sort_keys=True))
          PY

      - name: Diagnose live review GET from M1 without phone or owner input
        # Owner-facing URLs must be checked on the running M1 before advising.
        # GET only: no Guard action, review, Work, model or service mutation.
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          /opt/homebrew/bin/python3.12 -B - <<'PY'
          import http.client
          import json
          import os
          import ssl
          import platform

          result = {
              "status": "OWNER_REVIEW_ROUTE_DIAGNOSIS",
              "operator": "UNVERIFIED",
              "gateway_loopback": "UNVERIFIED",
              "serve_from_m1": "UNVERIFIED",
              "read_only": True,
              "owner_interaction": False,
              "model_calls": 0,
              "guard_writes": 0,
              "work_writes": 0,
              "service_mutations": 0,
          }
          if (platform.system() == "Darwin"
                  and platform.machine() in ("arm64", "aarch64")
                  and os.getuid() == 501 and os.geteuid() == 501):
              def probe(label, *, hostname, port, tls, host_header):
                  connection = None
                  try:
                      if tls == "verified":
                          connection = http.client.HTTPSConnection(
                              hostname, port, timeout=4,
                              context=ssl.create_default_context())
                      elif tls == "loopback":
                          # No secrets or owner tokens transmitted to the proxy.
                          connection = http.client.HTTPSConnection(
                              "127.0.0.1", port, timeout=4,
                              context=ssl._create_unverified_context())
                      else:
                          connection = http.client.HTTPConnection(
                              "127.0.0.1", port, timeout=4)
                      connection.request("GET", "/development/review",
                                         headers={"Host": host_header,
                                                  "Accept": "text/html"})
                      response = connection.getresponse()
                      status = response.status
                      # No HTML, source, identity or response body in CI logs.
                      result[label] = {
                          200: "HTTP_200",
                          400: "HTTP_400_HOST_OR_REQUEST_REJECTED",
                          403: "HTTP_403_OWNER_PROOF_REQUIRED",
                          404: "HTTP_404_ROUTE_MISSING",
                          503: "HTTP_503_REVIEW_OR_UPSTREAM_UNAVAILABLE",
                      }.get(status, "HTTP_OTHER")
                      if label == "operator" and status == 503:
                          body = response.read(192).decode(
                              "utf-8", errors="replace").strip()
                          result["operator_503_reason"] = {
                              "review unavailable": "ADAPTER_NOT_BOUND",
                              "owner review queue unavailable":
                                  "OWNER_REVIEW_QUEUE_UNAVAILABLE",
                          }.get(body, "UNCLASSIFIED_503")
                  except (OSError, TimeoutError, ValueError,
                          http.client.HTTPException, ssl.SSLError):
                      result[label] = "TRANSPORT_UNVERIFIED"
                  finally:
                      if connection is not None:
                          connection.close()

              probe("operator", hostname="127.0.0.1",
                    port=8766, tls="plain", host_header="127.0.0.1:8766")
