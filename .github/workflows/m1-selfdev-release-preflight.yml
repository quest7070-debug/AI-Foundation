    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 3
    steps:
      - name: Read back original Operator PID, endpoint and bounded staged source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          /opt/homebrew/bin/python3.12 -B - <<'PY'
          """One isolated M1 owner observation; never run candidate code.

          The loaded process is identified by launchd/PID/listener only.
          The declared source's disk bytes are compared to the staged exact
          candidate and are not mistaken for proof of loaded Python modules.
          Neither this check nor an existing Guard receipt authorizes release.
          """
          import hashlib, http.client, json, os, plistlib, re, stat, subprocess, sys
          from pathlib import Path

          label = 'dev.quest7070.ai-foundation.operator'
          root = Path.home() / '.ai-foundation-tunnel-sources'
          result = {
              'status': 'OPERATOR_RUNTIME_READBACK_UNVERIFIED',
              'operator_plist_bound': False,
              'operator_pid_listening_8766': False,
              'operator_api': 'NOT_VERIFIED',
              'operator_source_provenance': 'UNVERIFIED',
              'original_guard_release_history': 'NOT_RECONCILED',
              'current_guard_approval': 'NOT_CHECKED',
              'loaded_python_modules_verified': False,
              'production_candidate_installed': False,
              'mobile_owner_post': 'NOT_VERIFIED',
              'guard_writes': 0, 'service_mutations': 0, 'model_calls': 0,
          }

          def fixed(*argv):
              try:
                  return subprocess.run(list(argv), capture_output=True,
                                        text=True, timeout=5, check=False)
              except (OSError, ValueError, subprocess.SubprocessError):
                  return None

          def bounded_file(path, limit=131072):
              if path.is_symlink():
                  return None
              try:
                  info = path.stat()
                  if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= limit:
                      return None
                  return path.read_bytes()
              except (OSError, ValueError):
                  return None

          try:
              if sys.platform != 'darwin' or os.getuid() != 501 or os.geteuid() != 501:
                  raise ValueError('OWNER_M1_REQUIRED')
              plist = Path.home() / 'Library' / 'LaunchAgents' / (label + '.plist')
              info = plist.lstat()
              if (not stat.S_ISREG(info.st_mode) or info.st_uid != 501
                      or info.st_mode & 0o022 or info.st_size > 32768):
                  raise ValueError('OPERATOR_PLIST_UNVERIFIED')
              doc = plistlib.loads(plist.read_bytes())
              argv = doc.get('ProgramArguments')
              declared = doc.get('WorkingDirectory')
              if (doc.get('Label') != label or type(argv) is not list
                      or not 2 <= len(argv) <= 24
                      or any(type(v) is not str or len(v) > 4096 for v in argv)
                      or sum(v.endswith('/scripts/operator_server.py') for v in argv) != 1
                      or type(declared) is not str):
                  raise ValueError('OPERATOR_PLIST_UNVERIFIED')
              result['operator_plist_bound'] = True
              running = fixed('/bin/launchctl', 'print', 'gui/501/' + label)
              pids = (re.findall(r'^\s*pid = ([0-9]+)\s*$',
                     running.stdout, re.M)
                     if running is not None and running.returncode == 0
                     and len(running.stdout) <= 131072 else [])
              result['operator_launchd_pid_present'] = len(pids) == 1
              listener = (fixed('/usr/sbin/lsof', '-nP', '-t', '-iTCP:8766',
                                '-sTCP:LISTEN') if len(pids) == 1 else None)
              result['operator_pid_listening_8766'] = (
                  listener is not None and listener.returncode == 0
                  and listener.stdout.strip() == pids[0])
              if result['operator_pid_listening_8766']:
                  conn = http.client.HTTPConnection('127.0.0.1', 8766, timeout=3)
                  try:
                      conn.request('GET', '/api/human',
                                   headers={'Host':'127.0.0.1'})
                      response = conn.getresponse()
                      body = response.read(65537)
                      if (response.status == 200 and len(body) <= 65536
                              and type(json.loads(body)) is dict):
                          result['operator_api'] = 'HTTP_200_VALID_JSON'
                      else:
                          result['operator_api'] = 'UNVERIFIED_RESPONSE'
                  except (OSError, ValueError, TypeError, http.client.HTTPException):
                      result['operator_api'] = 'UNREACHABLE'
                  finally:
                      conn.close()
              # Installed Operator's canonical layout is NOT the Gateway's
              # .ai-foundation-tunnel-sources/<sha> layout. Its original
              # OperatorOnlyCutover pins the WorkingDirectory to a private
              # Guard scope-owned .../operator-release-staging/<scope>/candidate.
              # Validate its existing manifest and tracked entry digest,
              # without running candidate code or reading private work data.
              source_path = Path(declared)
              stage_root = (Path.home() / 'Library' / 'Application Support' /
                            'AI-Foundation' / 'operator-release-staging')
              stage = source_path.parent
              source_file = source_path / 'scripts/operator_server.py'
              entry = [v for v in argv if v.endswith('/scripts/operator_server.py')]
              valid_layout = (
                  source_path.name == 'candidate'
                  and stage.parent == stage_root
                  and re.fullmatch(r'[0-9a-f]{64}', stage.name) is not None
                  and source_path.is_dir()
                  and not source_path.is_symlink()
                  and not stage.is_symlink()
                  and stage.stat().st_uid == 501
                  and stage.stat().st_mode & 0o077 == 0
                  and len(entry) == 1
                  and Path(entry[0]) == source_file)
              result['operator_manifest_check'] = 'LAYOUT_UNRECOGNIZED'
              if valid_layout:
                  # The canonical release stages *every* tracked repository
                  # file and its SHA256. A 64KiB cap silently rejects a valid
                  # manifest of hundreds or thousands of tracked files.
                  manifest_path = stage / 'manifest.json'
                  meta = manifest_path.lstat()
                  if (not stat.S_ISREG(meta.st_mode)
                          or meta.st_uid != 501 or meta.st_mode & 0o077):
                      raise ValueError('GUARD_MANIFEST_UNTRUSTED')
                  manifest_bytes = bounded_file(manifest_path, 8*1024*1024)
                  installed = bounded_file(source_file)
                  if manifest_bytes is None or installed is None:
                      result['operator_manifest_check'] = 'BOUNDED_FILE_UNAVAILABLE'
                  else:
                      manifest = json.loads(manifest_bytes)
                      if type(manifest) is not dict:
                          raise ValueError('GUARD_MANIFEST_UNTRUSTED')
                      tracked = manifest.get('tracked')
                      committed = manifest.get('candidate_commit')
                      if (manifest.get('schema') != 1
                              or manifest.get('scope_ref') != stage.name
                              or type(committed) is not str
                              or re.fullmatch(r'[0-9a-f]{40}', committed) is None
                              or type(tracked) is not dict):
                          result['operator_manifest_check'] = 'SCOPE_OR_SCHEMA_UNVERIFIED'
                      elif (tracked.get('scripts/operator_server.py')
                              != hashlib.sha256(installed).hexdigest()):
                          result['operator_manifest_check'] = 'ENTRY_DIGEST_UNVERIFIED'
                      else:
                          result['operator_manifest_check'] = 'VERIFIED'
                          result['operator_declared_source_sha'] = committed
                          result['operator_declared_runner_digest'] = (
                              hashlib.sha256(installed).hexdigest())
                          result['operator_source_provenance'] = (
                              'GUARD_SCOPE_MANIFEST_DISK_VERIFIED')
                          candidate_sha = os.environ.get('CANDIDATE_SHA', '')
                          if re.fullmatch(r'[0-9a-f]{40}', candidate_sha):
                              candidate_path = root / candidate_sha
                              if (candidate_path.is_dir()
                                      and not candidate_path.is_symlink()):
                                  candidate = bounded_file(
                                      candidate_path / 'scripts/operator_server.py')
                                  if candidate is not None:
                                      result['operator_candidate_source_sha'] = (
                                          candidate_sha)
                                      result['operator_candidate_runner_digest'] = (
                                          hashlib.sha256(candidate).hexdigest())
                                      result['operator_runner_disk_update_required'] = (
                                          installed != candidate)
              result['operator_source_layout'] = (
                  'CANONICAL_GUARD_STAGE' if valid_layout
                  else 'UNRECOGNIZED')
              result['status'] = 'OPERATOR_RUNTIME_OBSERVED_NO_EFFECT'
          except (OSError, ValueError, TypeError, IndexError,
                  plistlib.InvalidFileException):
              result['status'] = 'OPERATOR_RUNTIME_READBACK_UNVERIFIED'
          print(json.dumps(result, sort_keys=True))
          PY
      - name: Read-only verified Operator release predecessor uniqueness
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          /opt/homebrew/bin/python3.12 -B - <<'PY'
          import json, os, re, sys
          from pathlib import Path
          sha = os.environ.get('CANDIDATE_SHA', '')
          result = {'status':'PREDECESSOR_UNVERIFIED', 'source_sha':sha,
                    'service_mutations':0, 'guard_writes':0,
                    'model_calls':0, 'owner_approval':'NOT_REQUESTED'}
          try:
              if (os.getuid() != 501 or os.geteuid() != 501
                      or re.fullmatch('[a-f0-9]{40}', sha) is None):
                  raise ValueError('OWNER_CONTEXT_UNVERIFIED')
              stage = Path.home() / '.ai-foundation-tunnel-sources' / sha
              if not stage.is_dir() or stage.is_symlink():
                  raise ValueError('CANDIDATE_SOURCE_UNVERIFIED')
              sys.path.insert(0, str(stage / 'src'))
              sys.path.insert(0, str(stage))
              from scripts import m1_owner_production_recovery as recovery
              source = recovery._source(sha)
              scope = recovery._operator_scope(source, sha, Path.home())
              _, _, prior = recovery._operator_predecessor(
                  Path.home(), scope, source)
              if re.fullmatch('[a-f0-9]{64}', prior) is None:
                  raise ValueError('PREDECESSOR_SCOPE_UNVERIFIED')
              result['status'] = 'UNIQUE_VERIFIED_PREDECESSOR'
              result['release_scope_ref'] = scope.scope_ref
          except Exception as error:
              # Do not reveal private owner filenames, DB records or messages.
              allowed = {'VERIFIED_OPERATOR_PREDECESSOR_NOT_UNIQUE',
                         'OPERATOR_LEDGER_UNTRUSTED',
                         'OPERATOR_LEDGER_INVENTORY_UNBOUNDED',
                         'OPERATOR_SCOPE_NOT_SOURCE_BOUND'}
              reason = str(error)
              result['reason'] = reason if reason in allowed else 'READBACK_UNVERIFIED'
          print('M1_OPERATOR_RELEASE_PREDECESSOR='+json.dumps(result,sort_keys=True))
          PY
      - name: Observe live Operator socket and HTTP without mutations
        run: |
          /opt/homebrew/bin/python3.12 -B - <<'PY'
          import http.client, json, os, re, subprocess
          result = {'status':'OWNER_RUNTIME_UNVERIFIED',
                    'launchd':'UNVERIFIED','tcp_8766':'UNVERIFIED',
                    'status_api':'UNVERIFIED','human_api':'UNVERIFIED',
                    'service_mutations':0,'guard_writes':0,'model_calls':0}
          if os.getuid()==501 and os.geteuid()==501:
              try:
                  proc=subprocess.run(['/bin/launchctl','print',
                      'gui/501/dev.quest7070.ai-foundation.operator'],
                      capture_output=True,text=True,timeout=5,check=False)
                  data=proc.stdout if len(proc.stdout)<=131072 else ''
                  pids=(re.findall(r'^\s*pid = (\d+)\s*$',data,re.M)
                        if proc.returncode==0 else [])
                  result['launchd']=('PID_PRESENT' if len(pids)==1
                      else 'REGISTERED_NO_PID' if proc.returncode==0
                      else 'NOT_REGISTERED')
                  if len(pids)==1:
                      tcp=subprocess.run(['/usr/sbin/lsof','-nP','-t',
                          '-iTCP:8766','-sTCP:LISTEN'],capture_output=True,
                          text=True,timeout=5,check=False)
                      result['tcp_8766']=('EXACT_PID' if tcp.returncode==0
                          and tcp.stdout.strip()==pids[0] else 'NOT_EXACT_PID')
                      if result['tcp_8766']=='EXACT_PID':
                          for uri,key in (('/api/human/status','status_api'),
                                          ('/api/human','human_api')):
                              conn=http.client.HTTPConnection('127.0.0.1',8766,timeout=2)
                              try:
                                  conn.request('GET',uri,headers={'Host':'127.0.0.1:8766'})
                                  response=conn.getresponse()
                                  payload=response.read(65537)
                                  result[key]=('HTTP_200_JSON' if response.status==200
                                      and len(payload)<=65536
                                      and type(json.loads(payload)) is dict
                                      else 'HTTP_INVALID')
                              except (OSError,ValueError,TypeError,http.client.HTTPException):
                                  result[key]='TRANSPORT_OR_TIMEOUT'
                              finally:conn.close()
                  result['status']='OBSERVED_NO_EFFECT'
              except (OSError,ValueError,subprocess.SubprocessError):
                  result['status']='READBACK_FAILED_NO_EFFECT'
          print('M1_OPERATOR_LOCAL_HEALTH='+json.dumps(result,sort_keys=True))
          PY

