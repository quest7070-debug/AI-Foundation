name: Foundation M1 tunnel reviewed source stage (no services)

# Separate from the strict read-only M1 diagnostic. This owner-requested job
# adds one version-pinned worktree only. It never starts the tunnel or touches
# Operator/Guard/9B/KLM/Native. No change to the owner working branch.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: foundation-tunnel-stage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fixed-source-stage:
    if: >-
      github.repository == 'quest7070-dev/AI-Foundation' &&
      github.event.issue.user.login == 'quest7070-debug' &&
      github.event.issue.title == 'Foundation M1 Tunnel Stage: source-only'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 4
    steps:
      - name: Checkout trusted event-time main, never Issue code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install only a pinned owner-private MCP source worktree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          /opt/homebrew/bin/python3.12 -B scripts/m1_foundation_tunnel_stage.py
